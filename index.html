<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#07080d"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-192.png"><title>Game Store preview</title>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,500;0,700;1,700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#07080d;--card:#10121a;--line:#232838;--text:#eef1ff;--muted:#8b93b0;--hot:#ff6a1a;--hot2:#ffb12e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;color:var(--text);font:500 15px/1.45 "Chakra Petch",system-ui,sans-serif;background:radial-gradient(ellipse 70% 40% at 50% -5%,color-mix(in srgb,var(--hot) 28%,transparent),transparent 70%),repeating-linear-gradient(135deg,#ffffff06 0 1px,transparent 1px 14px),var(--bg) fixed}
.sw{position:sticky;top:0;z-index:4;display:flex;gap:8px;padding:10px 16px;background:#07080dea;border-bottom:1px solid var(--line)}.sw button{flex:1}
header,main,.adm,footer{max-width:960px;margin:auto;padding:8px 16px}footer{color:var(--muted);text-align:center;padding:24px 16px 40px}
header{padding-top:28px}.hero{position:relative;overflow:hidden;padding:6px 0 4px}.xh{position:absolute;right:-30px;top:-10px;width:170px;height:170px;opacity:.3;pointer-events:none;color:var(--hot);animation:spin 24s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
h1{margin:0;font:italic 700 clamp(36px,10vw,64px)/1 "Chakra Petch",sans-serif;background:linear-gradient(90deg,var(--hot2),var(--hot) 55%,#ff3d5a);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 18px color-mix(in srgb,var(--hot) 40%,transparent))}
.bo{font:italic 700 18px "Chakra Petch",sans-serif;color:#ffd9bd;margin-top:8px}.note{color:var(--muted);margin:6px 0 0}.tick{margin-top:14px;display:inline-block;border-left:4px solid var(--hot);background:color-mix(in srgb,var(--hot) 10%,transparent);padding:8px 14px;color:#ffd9bd;font-size:14px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.chip{border:1px solid #2b3250;background:#0e1019;padding:5px 14px;font-size:13px;color:#cfd6f3;transform:skewX(-10deg)}
.tabs{display:flex;gap:8px;overflow:auto;padding:14px 4px 16px}.tab{flex:none;background:#151828;border:1px solid var(--line);color:#aeb6d4;padding:9px 18px;transform:skewX(-12deg);font:inherit;font-weight:700;cursor:pointer;border-radius:3px}.tab.on{background:var(--hot);border-color:var(--hot2);color:#160800;box-shadow:0 0 18px color-mix(in srgb,var(--hot) 45%,transparent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.p{--a:#ff7a1a;background:linear-gradient(135deg,var(--a),#232838 45%);padding:1px;clip-path:polygon(0 0,calc(100% - 18px) 0,100% 18px,100% 100%,18px 100%,0 calc(100% - 18px));transition:transform .18s}.p:hover{transform:translateY(-4px)}
.pi{position:relative;background:var(--card);height:100%;display:flex;flex-direction:column;clip-path:polygon(0 0,calc(100% - 18px) 0,100% 18px,100% 100%,18px 100%,0 calc(100% - 18px))}
.ph{height:120px;display:grid;place-items:center;text-align:center;padding:8px;font:italic 700 26px "Chakra Petch",sans-serif;color:transparent;-webkit-text-stroke:1.5px var(--a);background:linear-gradient(160deg,color-mix(in srgb,var(--a) 28%,#10121a),#10121a 75%);text-shadow:0 0 24px var(--a)}
.im{width:100%;height:130px;object-fit:cover;display:block;background:#10121a}.bd{position:absolute;top:8px;left:0;background:var(--a);color:#160800;font-weight:700;font-size:12px;padding:3px 12px 3px 8px;z-index:1;clip-path:polygon(0 0,100% 0,calc(100% - 8px) 100%,0 100%)}
.pb{padding:12px 14px 16px;display:flex;flex-direction:column;gap:6px;flex:1}.pb h3{margin:0;font-size:17px}.pb p{margin:0;color:var(--muted);font-size:13px;flex:1}.price{color:var(--hot2);font-weight:700;font-size:22px}.price s{color:var(--muted);font-size:13px;margin-left:8px;font-weight:500}
button{font:inherit;font-weight:700;cursor:pointer;padding:10px 14px;background:#151828;color:var(--text);border:1px solid var(--line);border-radius:3px}button.g,button.on{background:var(--a,var(--hot));color:#160800;border-color:transparent;clip-path:polygon(0 0,calc(100% - 10px) 0,100% 10px,100% 100%,10px 100%,0 calc(100% - 10px))}button.g:hover{filter:brightness(1.12)}button:disabled{opacity:.4;cursor:not-allowed}button.d{background:#2a1020;border-color:#6d2940;color:#ff9daf}
#m{position:fixed;inset:0;background:#000c;display:none;align-items:flex-end;justify-content:center;z-index:9}#m.on{display:flex}.sheet{background:#0e1019;border:1px solid var(--hot);border-bottom:0;border-radius:18px 18px 0 0;width:100%;max-width:520px;max-height:92vh;overflow:auto;padding:18px;display:grid;gap:10px;box-shadow:0 -10px 40px color-mix(in srgb,var(--hot) 25%,transparent)}.sheet h2{margin:0;font:italic 700 22px "Chakra Petch",sans-serif;color:var(--hot2)}
input,select,textarea{width:100%;background:#080a12;border:1px solid #2b3250;border-radius:4px;color:var(--text);padding:10px;font:inherit}input[type=color]{padding:2px;height:42px}input:focus,select:focus,textarea:focus{outline:2px solid var(--hot);border-color:transparent}
.pay{display:block;border:1px solid var(--line);padding:10px;cursor:pointer;border-radius:4px}.pay:has(input:checked){border-color:var(--hot);background:color-mix(in srgb,var(--hot) 8%,transparent)}.pay input{width:auto}.pay small{display:block;color:var(--muted)}.pay img{max-width:160px;margin-top:8px;display:block}
#by{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:#000d;z-index:20;pointer-events:none}#by.on{display:flex;animation:pop .35s cubic-bezier(.2,1.4,.4,1)}#by b{font:italic 700 clamp(56px,18vw,120px)/1 "Chakra Petch",sans-serif;background:linear-gradient(90deg,var(--hot2),var(--hot),#ff3d5a);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 30px var(--hot))}#by span{color:#ffd9bd}@keyframes pop{from{transform:scale(.6);opacity:0}}
.c{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--hot);padding:14px;display:grid;gap:8px;margin-bottom:12px}.c h2{margin:0;font:italic 700 20px "Chakra Petch",sans-serif;color:var(--hot2)}.item{border:1px solid var(--line);padding:10px;display:grid;gap:8px;background:#0b0d15}.r{display:grid;grid-template-columns:1fr 1fr;gap:8px}.r3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}label{font-size:12px;color:var(--muted);display:grid;gap:4px}.chk{display:flex;align-items:center;gap:8px;color:var(--text);font-size:14px}.chk input{width:auto}
.imgrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.th{width:84px;height:64px;object-fit:cover;border:1px solid var(--line)}.tip{background:color-mix(in srgb,var(--hot) 8%,transparent);border-left:4px solid var(--hot);padding:10px 12px;font-size:13px;color:#ffd9bd;margin-bottom:12px}
.bar{position:sticky;bottom:8px;display:flex;gap:10px;align-items:center;background:#0e1019f2;border:1px solid var(--hot);padding:10px}#msg{color:var(--muted);flex:1;font-size:13px}
.bell{position:absolute;right:0;top:0;z-index:3;padding:9px 11px;background:#151828;border:1px solid var(--line);color:var(--hot2);display:grid;place-items:center}.bell svg{width:22px;height:22px}#bn{position:absolute;top:-8px;right:-8px;background:#ff3d5a;color:#fff;border-radius:999px;font:700 11px sans-serif;min-width:19px;height:19px;display:none;place-items:center;font-style:normal}.nt2{border-left:3px solid var(--hot);background:#0b0d15;padding:10px 12px}.nt2 p{margin:4px 0;color:#cfd6f3;font-size:14px}.nt2 small{color:var(--muted)}
.live{display:inline-flex;align-items:center;gap:9px;border:1px solid #2b3250;background:#0e1019;padding:6px 14px;font-weight:700;color:#cfd6f3;margin-bottom:12px;transform:skewX(-10deg)}.live i{width:9px;height:9px;border-radius:50%;background:#43d9a0;box-shadow:0 0 8px #43d9a0;animation:pl 1.6s ease-in-out infinite}@keyframes pl{50%{opacity:.35}}
@media(prefers-reduced-motion:reduce){.live i{animation:none}.p{transition:none}.xh,#by.on{animation:none}}
a.dl{display:block;text-align:center;text-decoration:none;padding:13px;font:inherit;font-weight:700;background:var(--a,var(--hot));color:#160800;clip-path:polygon(0 0,calc(100% - 10px) 0,100% 10px,100% 100%,10px 100%,0 calc(100% - 10px))}
.sup{position:fixed;right:14px;bottom:14px;z-index:5;display:none;background:var(--hot);color:#160800;border:0;padding:12px 18px;font:inherit;font-weight:700;border-radius:30px;cursor:pointer;box-shadow:0 6px 20px rgba(0,0,0,.5)}
#ft{margin-bottom:64px}
</style></head><body><div id="vc"><header><div class="hero"><svg class="xh" viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="50" cy="50" r="30"/><circle cx="50" cy="50" r="4" fill="currentColor"/><path d="M50 4v26M50 70v26M4 50h26M70 50h26"/></svg><button class="bell" id="bell" aria-label="Notifications"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10 21a2 2 0 0 0 4 0"/></svg><i id="bn"></i></button><div class="live" id="lv"><i></i><span id="au"></span> active users</div><h1 id="nm"></h1><div class="bo" id="bo"></div><span class="tick" id="nt"></span><div class="chips" id="chips"></div></div></header>
<main><div class="tabs" id="tabs"></div><div class="grid" id="list"></div></main><footer id="ft"></footer>
<button class="sup" id="sup">Support</button><div id="by"><b id="byt">BOOYAH!</b><span>Order sent</span></div><div id="m"><div class="sheet" id="sh"></div></div></div><script>const $=id=>document.getElementById(id),E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let D,cat='All',cur=null,TH={};
function norm(d){d.shop=Object.assign({name:'',tagline:'',notice:'',footer:'',booyah:'BOOYAH!',whatsapp:'',activeUsers:'',dbUrl:'',fbPage:''},d.shop);d.shop.support=d.shop.support||[];d.theme=Object.assign({a1:'#ff6a1a',a2:'#ffb12e',bg:'#07080d'},d.theme);d.chips=d.chips||[];d.notices=d.notices||[];d.payments=d.payments||[];d.products=d.products||[];d.categories=(d.categories||[]).map(c=>typeof c=='string'?{name:c,color:'#ffb12e'}:c);return d}
const col=n=>((D.categories.find(c=>c.name===n))||{}).color||D.theme.a2,src=p=>TH[p]||p;
function theme(){const r=document.documentElement.style;r.setProperty('--hot',D.theme.a1);r.setProperty('--hot2',D.theme.a2);r.setProperty('--bg',D.theme.bg)}
function rc(){theme();bell();const sp=D.shop;$('sup').style.display=(sp.fbPage||sp.whatsapp||sp.support.length)?'block':'none';const s=D.shop;$('au').textContent=s.activeUsers||'';$('lv').style.display=s.activeUsers?'inline-flex':'none';document.title=s.name||'Shop';$('nm').textContent=s.name||'';$('bo').textContent=s.tagline||'';$('bo').style.display=s.tagline?'block':'none';$('nt').textContent=s.notice||'';$('nt').style.display=s.notice?'inline-block':'none';$('ft').textContent=s.footer||'';$('chips').innerHTML=D.chips.map(c=>`<span class="chip">${E(c)}</span>`).join('');
const cats=['All',...D.categories.map(c=>c.name)];if(!cats.includes(cat))cat='All';$('tabs').innerHTML=cats.map(c=>`<button class="tab ${c===cat?'on':''}" data-c="${E(c)}">${E(c)}</button>`).join('');
const l=D.products.filter(p=>cat==='All'||p.cat===cat);
$('list').innerHTML=l.length?l.map(p=>`<div class="p" style="--a:${E(col(p.cat))}"><div class="pi">${p.badge?`<span class="bd">${E(p.badge)}</span>`:''}${p.img?`<img class="im" src="${E(src(p.img))}" alt="" loading="lazy">`:`<div class="ph">${E(p.cat)}</div>`}<div class="pb"><h3>${E(p.title)}</h3><p>${E(p.desc)}</p><div class="price">${p.free?'FREE':E(p.price)}${!p.free&&p.old?`<s>${E(p.old)}</s>`:''}</div><button class="g" data-id="${E(p.id)}" ${p.stock===false?'disabled':''}>${p.stock===false?'Out of stock':p.free?'Get free':'Buy now'}</button></div></div></div>`).join(''):'<p class="note">Nothing here yet. Check back soon.</p>'}
$('tabs').onclick=e=>{const c=e.target.dataset.c;if(c){cat=c;rc()}};
$('list').onclick=e=>{const id=e.target.dataset.id;if(!id)return;cur=D.products.find(p=>p.id===id);if(cur.free)return showFree(cur);const sh=$('sh');sh.style.setProperty('--a',col(cur.cat));
sh.innerHTML=`<h2>${E(cur.title)} - ${E(cur.price)}</h2><input id="uid" placeholder="Your Free Fire UID / ID details"><input id="unm" placeholder="Your name"><b>Pay with</b>${D.payments.map((p,i)=>`<label class="pay"><input type="radio" name="pm" value="${i}" ${i?'':'checked'}> <b>${E(p.name)}</b><small>${E(p.details)}</small>${p.qr?`<img src="${E(src(p.qr))}" alt="QR code">`:''}</label>`).join('')}<p class="note">Pay first, then send your order and payment screenshot on WhatsApp.</p><button class="g" id="send">Send order on WhatsApp</button><button id="cl">Cancel</button>`;$('m').classList.add('on');
$('cl').onclick=()=>$('m').classList.remove('on');
$('send').onclick=()=>{const u=$('uid').value.trim();if(!u){$('uid').focus();return}const pm=D.payments[+(document.querySelector('input[name=pm]:checked')||{}).value]||{name:'-'};
const t=`New order%0AProduct: ${encodeURIComponent(cur.title)} (${encodeURIComponent(cur.price)})%0AID: ${encodeURIComponent(u)}%0AName: ${encodeURIComponent($('unm').value)}%0APayment: ${encodeURIComponent(pm.name)}`;
$('m').classList.remove('on');$('byt').textContent=D.shop.booyah||'BOOYAH!';$('by').classList.add('on');setTimeout(()=>{$('by').classList.remove('on');if(!window.LOCAL)location.href='https://wa.me/'+String(((D.categories.find(c=>c.name===cur.cat)||{}).whatsapp)||D.shop.whatsapp||'').replace(/\D/g,'')+'?text='+t},1500)}};
$('m').onclick=e=>{if(e.target===$('m'))$('m').classList.remove('on')};
const SK='seen_n';let seenMem=0;const seen=()=>{try{return +(localStorage.getItem(SK)||0)}catch(e){return seenMem}};
const unread=()=>D.notices.filter(n=>+n.id>seen());
function bell(){const u=unread().length,b=$('bn');b.textContent=u;b.style.display=u?'grid':'none'}
function showN(){const sh=$('sh'),l=[...D.notices].sort((a,b)=>b.id-a.id);sh.style.setProperty('--a',D.theme.a1);
sh.innerHTML=`<h2>Notifications</h2>${l.length?l.map(n=>`<div class="nt2"><b>${E(n.title)}</b><p>${E(n.body)}</p><small>${E(new Date(+n.id).toLocaleDateString())}</small></div>`).join(''):'<p class="note">No notifications yet.</p>'}<button id="cl">Close</button>`;
$('m').classList.add('on');$('cl').onclick=()=>$('m').classList.remove('on');;
const mx=Math.max(0,...D.notices.map(n=>+n.id));seenMem=mx;try{localStorage.setItem(SK,mx)}catch(e){}bell()}
$('bell').onclick=showN;
async function poll(){try{const nd=norm(await(await fetch('products.json?t='+Date.now(),{cache:'no-store'})).json()),old=new Set(D.notices.map(n=>n.id)),fresh=nd.notices.filter(n=>!old.has(n.id));D=nd;const open=$('m').classList.contains('on');if(open)bell();else rc();if(!open&&fresh.some(n=>n.popup))showN()}catch(e){}}
function track(){const db=(D.shop.dbUrl||'').replace(/\/$/,'');if(!db||window.LOCAL)return;try{let id=localStorage.getItem('uid'),f=+localStorage.getItem('uf')||0;if(!id){id=Math.random().toString(36).slice(2,12)+Date.now().toString(36);f=Date.now();localStorage.setItem('uid',id);localStorage.setItem('uf',f)}fetch(db+'/users/'+id+'.json',{method:'PUT',body:JSON.stringify({f,l:Date.now()})}).catch(()=>{})}catch(e){}}
function startN(){track();if(unread().some(n=>n.popup))showN();if(window.LOCAL)return;setInterval(poll,60000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)poll()})}
const U=u=>/^https?:\/\//i.test(u)?u:'https://'+u,lk=t=>E(t).replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank" rel="noopener" style="color:var(--hot2)">$1</a>').replace(/\n/g,'<br>');
function showFree(p){const sh=$('sh');sh.style.setProperty('--a',col(p.cat));sh.innerHTML=`<h2>${E(p.title)} - FREE</h2><p class="note">${lk(p.freeNote||'This one is free.')}</p>${p.dl?`<a class="dl" href="${E(U(p.dl))}" target="_blank" rel="noopener">Download now</a>`:''}<button id="cl">Close</button>`;$('m').classList.add('on');$('cl').onclick=()=>$('m').classList.remove('on')}
function showSupport(){const s=D.shop,sh=$('sh'),L=[];if(s.fbPage)L.push(['Facebook page',U(s.fbPage)]);const w=String(s.whatsapp||'').replace(/\D/g,'');if(w)L.push(['WhatsApp support','https://wa.me/'+w]);s.support.forEach(x=>{if(x.label&&x.url)L.push([x.label,U(x.url)])});sh.style.setProperty('--a',D.theme.a1);sh.innerHTML='<h2>Support</h2>'+L.map(x=>`<a class="dl" href="${E(x[1])}" target="_blank" rel="noopener">${E(x[0])}</a>`).join('')+'<button id="cl">Close</button>';$('m').classList.add('on');$('cl').onclick=()=>$('m').classList.remove('on')}
$('sup').onclick=showSupport;
fetch('products.json?t='+Date.now(),{cache:'no-store'}).then(r=>r.json()).then(j=>{D=norm(j);rc();startN()}).catch(()=>{$('list').innerHTML='<p class="note">Could not load the shop. Please refresh.</p>'});
</script><script>if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))</script></body></html>
