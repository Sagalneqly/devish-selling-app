<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#07080d"><link rel="manifest" href="admin-manifest.json"><link rel="apple-touch-icon" href="icon-192.png"><title>Shop Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,500;0,700;1,700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#07080d;--card:#10121a;--line:#232838;--text:#eef1ff;--muted:#8b93b0;--hot:#ff6a1a;--hot2:#ffb12e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;color:var(--text);font:500 15px/1.45 "Chakra Petch",system-ui,sans-serif;background:radial-gradient(ellipse 70% 40% at 50% -5%,color-mix(in srgb,var(--hot) 28%,transparent),transparent 70%),repeating-linear-gradient(135deg,#ffffff06 0 1px,transparent 1px 14px),var(--bg) fixed}
.sw{position:sticky;top:0;z-index:4;display:flex;gap:8px;padding:10px 16px;background:#07080dea;border-bottom:1px solid var(--line)}.sw button{flex:1}
header,main,.adm,footer{max-width:960px;margin:auto;padding:8px 16px}footer{color:var(--muted);text-align:center;padding:24px 16px 40px}
header{padding-top:28px}.hero{position:relative;overflow:hidden;padding:6px 0 4px}.xh{position:absolute;right:-30px;top:-10px;width:170px;height:170px;opacity:.3;pointer-events:none;color:var(--hot);animation:spin 24s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
h1{margin:0;font:italic 700 clamp(36px,10vw,64px)/1 "Chakra Petch",sans-serif;background:linear-gradient(90deg,var(--hot2),var(--hot) 55%,#ff3d5a);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 18px color-mix(in srgb,var(--hot) 40%,transparent))}
.bo{font:italic 700 18px "Chakra Petch",sans-serif;color:#ffd9bd;margin-top:8px}.note{color:var(--muted);margin:6px 0 0}.tick{margin-top:14px;display:inline-block;border-left:4px solid var(--hot);background:color-mix(in srgb,var(--hot) 10%,transparent);padding:8px 14px;color:#ffd9bd;font-size:14px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.chip{border:1px solid #2b3250;background:#0e1019;padding:5px 14px;font-size:13px;color:#cfd6f3;transform:skewX(-10deg)}
.tabs{display:flex;gap:8px;overflow:auto;padding:14px 4px 16px}.tab{flex:none;background:#151828;border:1px solid var(--line);color:#aeb6d4;padding:9px 18px;transform:skewX(-12deg);font:inherit;font-weight:700;cursor:pointer;border-radius:3px}.tab.on{background:var(--hot);border-color:var(--hot2);color:#160800;box-shadow:0 0 18px color-mix(in srgb,var(--hot) 45%,transparent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.p{--a:#ff7a1a;background:linear-gradient(135deg,var(--a),#232838 45%);padding:1px;clip-path:polygon(0 0,calc(100% - 18px) 0,100% 18px,100% 100%,18px 100%,0 calc(100% - 18px));transition:transform .18s}.p:hover{transform:translateY(-4px)}
.pi{position:relative;background:var(--card);height:100%;display:flex;flex-direction:column;clip-path:polygon(0 0,calc(100% - 18px) 0,100% 18px,100% 100%,18px 100%,0 calc(100% - 18px))}
.ph{height:120px;display:grid;place-items:center;text-align:center;padding:8px;font:italic 700 26px "Chakra Petch",sans-serif;color:transparent;-webkit-text-stroke:1.5px var(--a);background:linear-gradient(160deg,color-mix(in srgb,var(--a) 28%,#10121a),#10121a 75%);text-shadow:0 0 24px var(--a)}
.im{width:100%;height:130px;object-fit:cover;display:block;background:#10121a}.bd{position:absolute;top:8px;left:0;background:var(--a);color:#160800;font-weight:700;font-size:12px;padding:3px 12px 3px 8px;z-index:1;clip-path:polygon(0 0,100% 0,calc(100% - 8px) 100%,0 100%)}
.pb{padding:12px 14px 16px;display:flex;flex-direction:column;gap:6px;flex:1}.pb h3{margin:0;font-size:17px}.pb p{margin:0;color:var(--muted);font-size:13px;flex:1}.price{color:var(--hot2);font-weight:700;font-size:22px}.price s{color:var(--muted);font-size:13px;margin-left:8px;font-weight:500}
button{font:inherit;font-weight:700;cursor:pointer;padding:10px 14px;background:#151828;color:var(--text);border:1px solid var(--line);border-radius:3px}button.g,button.on{background:var(--a,var(--hot));color:#160800;border-color:transparent;clip-path:polygon(0 0,calc(100% - 10px) 0,100% 10px,100% 100%,10px 100%,0 calc(100% - 10px))}button.g:hover{filter:brightness(1.12)}button:disabled{opacity:.4;cursor:not-allowed}button.d{background:#2a1020;border-color:#6d2940;color:#ff9daf}
#m{position:fixed;inset:0;background:#000c;display:none;align-items:flex-end;justify-content:center;z-index:9}#m.on{display:flex}.sheet{background:#0e1019;border:1px solid var(--hot);border-bottom:0;border-radius:18px 18px 0 0;width:100%;max-width:520px;max-height:92vh;overflow:auto;padding:18px;display:grid;gap:10px;box-shadow:0 -10px 40px color-mix(in srgb,var(--hot) 25%,transparent)}.sheet h2{margin:0;font:italic 700 22px "Chakra Petch",sans-serif;color:var(--hot2)}
input,select,textarea{width:100%;background:#080a12;border:1px solid #2b3250;border-radius:4px;color:var(--text);padding:10px;font:inherit}input[type=color]{padding:2px;height:42px}input:focus,select:focus,textarea:focus{outline:2px solid var(--hot);border-color:transparent}
.pay{display:block;border:1px solid var(--line);padding:10px;cursor:pointer;border-radius:4px}.pay:has(input:checked){border-color:var(--hot);background:color-mix(in srgb,var(--hot) 8%,transparent)}.pay input{width:auto}.pay small{display:block;color:var(--muted)}.pay img{max-width:160px;margin-top:8px;display:block}
#by{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:#000d;z-index:20;pointer-events:none}#by.on{display:flex;animation:pop .35s cubic-bezier(.2,1.4,.4,1)}#by b{font:italic 700 clamp(56px,18vw,120px)/1 "Chakra Petch",sans-serif;background:linear-gradient(90deg,var(--hot2),var(--hot),#ff3d5a);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 30px var(--hot))}#by span{color:#ffd9bd}@keyframes pop{from{transform:scale(.6);opacity:0}}
.c{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--hot);padding:14px;display:grid;gap:8px;margin-bottom:12px}.c h2{margin:0;font:italic 700 20px "Chakra Petch",sans-serif;color:var(--hot2)}.item{border:1px solid var(--line);padding:10px;display:grid;gap:8px;background:#0b0d15}.r{display:grid;grid-template-columns:1fr 1fr;gap:8px}.r3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}label{font-size:12px;color:var(--muted);display:grid;gap:4px}.chk{display:flex;align-items:center;gap:8px;color:var(--text);font-size:14px}.chk input{width:auto}
.imgrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.th{width:84px;height:64px;object-fit:cover;border:1px solid var(--line)}.tip{background:color-mix(in srgb,var(--hot) 8%,transparent);border-left:4px solid var(--hot);padding:10px 12px;font-size:13px;color:#ffd9bd;margin-bottom:12px}
.bar{position:sticky;bottom:8px;display:flex;gap:10px;align-items:center;background:#0e1019f2;border:1px solid var(--hot);padding:10px}#msg{color:var(--muted);flex:1;font-size:13px}
.bell{position:absolute;right:0;top:0;z-index:3;padding:9px 11px;background:#151828;border:1px solid var(--line);color:var(--hot2);display:grid;place-items:center}.bell svg{width:22px;height:22px}#bn{position:absolute;top:-8px;right:-8px;background:#ff3d5a;color:#fff;border-radius:999px;font:700 11px sans-serif;min-width:19px;height:19px;display:none;place-items:center;font-style:normal}.nt2{border-left:3px solid var(--hot);background:#0b0d15;padding:10px 12px}.nt2 p{margin:4px 0;color:#cfd6f3;font-size:14px}.nt2 small{color:var(--muted)}
.live{display:inline-flex;align-items:center;gap:9px;border:1px solid #2b3250;background:#0e1019;padding:6px 14px;font-weight:700;color:#cfd6f3;margin-bottom:12px;transform:skewX(-10deg)}.live i{width:9px;height:9px;border-radius:50%;background:#43d9a0;box-shadow:0 0 8px #43d9a0;animation:pl 1.6s ease-in-out infinite}@keyframes pl{50%{opacity:.35}}
@media(prefers-reduced-motion:reduce){.live i{animation:none}.p{transition:none}.xh,#by.on{animation:none}}
</style></head><body><div id="va" class="adm"><h1 style="font-size:34px">Shop Admin</h1><p class="note"><a href="index.html" style="color:var(--hot2)">Open customer app</a> | <a href="#" onclick="out();return false" style="color:var(--hot2)">Disconnect</a></p><div id="ed"></div><input type="file" id="fi" accept="image/*" hidden><div class="bar" id="bar" style="display:none"><span id="msg"></span><button class="g" onclick="save()">Save to shop</button></div></div><script>const $=id=>document.getElementById(id),E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let D,cat='All',cur=null,TH={};
function norm(d){d.shop=Object.assign({name:'',tagline:'',notice:'',footer:'',booyah:'BOOYAH!',whatsapp:'',activeUsers:'',dbUrl:'',fbPage:'',admobBanner:'',admobInter:'',promoTitle:'Promotions',promoCta:'',aboutTitle:'About us',aboutText:''},d.shop);d.shop.support=d.shop.support||[];d.promos=d.promos||[];d.theme=Object.assign({a1:'#ff6a1a',a2:'#ffb12e',bg:'#07080d'},d.theme);d.chips=d.chips||[];d.notices=d.notices||[];d.payments=d.payments||[];d.products=d.products||[];d.categories=(d.categories||[]).map(c=>typeof c=='string'?{name:c,color:'#ffb12e'}:c);return d}
const col=n=>((D.categories.find(c=>c.name===n))||{}).color||D.theme.a2,src=p=>TH[p]||p;
function theme(){const r=document.documentElement.style;r.setProperty('--hot',D.theme.a1);r.setProperty('--hot2',D.theme.a2);r.setProperty('--bg',D.theme.bg)}
const msg=t=>{const m=$('msg');if(m)m.textContent=t};
async function resize(f){const b=await createImageBitmap(f),s=Math.min(1,700/Math.max(b.width,b.height)),c=document.createElement('canvas');c.width=Math.round(b.width*s);c.height=Math.round(b.height*s);c.getContext('2d').drawImage(b,0,0,c.width,c.height);return c.toDataURL('image/jpeg',.82)}
let pk=null;function pick(k,i){pk=[k,i];$('fi').click()}
$('fi').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f||!pk)return;const[k,i]=pk;msg('Adding image...');try{const u=await uploadImg(f);if(k=='pay')D.payments[i].qr=u;else if(k=='promo')D.promos[i].img=u;else D.products[i].img=u;ra();msg('Image added. Press Save to shop.')}catch(x){msg('Image upload failed ('+x+'). Check your token and connection.')}};
function renCat(i,v){const o=D.categories[i].name;D.products.forEach(p=>{if(p.cat===o)p.cat=v});D.categories[i].name=v}
function mv(i,d){const j=i+d;if(j<0||j>=D.products.length)return;[D.products[i],D.products[j]]=[D.products[j],D.products[i]];ra()}
const fld=(l,path,v)=>`<label>${l}<input value="${E(v)}" oninput="${path}=this.value"></label>`;
function imgRow(k,i,u,a,b){return `<div class="imgrow">${u?`<img class="th" src="${E(src(u))}" alt="">`:''}<button onclick="pick('${k}',${i})">${u?'Change '+a:'Upload '+a}</button>${u?`<button class="d" onclick="${b}='';ra()">Remove image</button>`:''}</div>`}
let SC='';const num=n=>Number(n).toLocaleString();
async function stats(f){const el=$('st');if(!el)return;if(SC&&!f){el.innerHTML=SC;return}let t,d,w,nt='';
if(window.LOCAL){t=0;d=0;w=0;nt='This preview has no database, so it shows zero. Real numbers show in your real admin.html after you connect the database.'}else{const db=(D.shop.dbUrl||'').replace(/\/$/,'');if(!db){el.innerHTML='<p class="note">Add your database link in Look and text, save, and reload to count users.</p>';return}el.textContent='Loading...';try{const o=await(await fetch(db+'/users.json')).json()||{},v=Object.values(o),n=Date.now();t=v.length;d=v.filter(x=>n-x.l<864e5).length;w=v.filter(x=>n-x.l<6048e5).length}catch(e){el.innerHTML='<p class="note">Could not read the numbers. Check the database link and rules.</p>';return}}
SC=`<div class="r3"><div class="item"><b style="font-size:26px">${num(t)}</b><span class="note">Total users</span></div><div class="item"><b style="font-size:26px">${num(d)}</b><span class="note">Active today</span></div><div class="item"><b style="font-size:26px">${num(w)}</b><span class="note">Last 7 days</span></div></div><p class="note" style="margin:0">${nt}</p>`;el.innerHTML=SC}
function ra(){const s=D.shop,t=D.theme;setTimeout(()=>stats(),0);$('ed').innerHTML=`<div class="c"><h2>App users</h2><div id="st"></div><button onclick="stats(true)">Refresh numbers</button><p class="note" style="margin:0">Counts phones that opened the shop. Clearing app data counts as a new user.</p></div><div class="c"><h2>Look and text</h2>${fld('Shop name','D.shop.name',s.name)}${fld('Tagline','D.shop.tagline',s.tagline)}${fld('Notice bar','D.shop.notice',s.notice)}${fld('Footer text','D.shop.footer',s.footer)}${fld('Order popup text','D.shop.booyah',s.booyah)}${fld('WhatsApp number (country code, digits only)','D.shop.whatsapp',s.whatsapp)}${fld('Active users text at the top (example 1500+)','D.shop.activeUsers',s.activeUsers)}${fld('Database link for counting users (Firebase)','D.shop.dbUrl',s.dbUrl)}${fld('Facebook page link (shown in customer Support menu)','D.shop.fbPage',s.fbPage)}${fld('AdMob banner ad unit ID (APK only, leave empty for no ads)','D.shop.admobBanner',s.admobBanner)}${fld('AdMob full-screen ad unit ID (shows once when a customer taps Buy or Get free; leave empty for none)','D.shop.admobInter',s.admobInter)}
<div class="r3"><label>Main color<input type="color" value="${t.a1}" oninput="D.theme.a1=this.value"></label><label>Second color<input type="color" value="${t.a2}" oninput="D.theme.a2=this.value"></label><label>Background<input type="color" value="${t.bg}" oninput="D.theme.bg=this.value"></label></div>
<label>Header chips (comma separated)<input value="${E(D.chips.join(', '))}" oninput="D.chips=this.value.split(',').map(x=>x.trim()).filter(Boolean)"></label></div>
<div class="c"><h2>Promotions (sponsored banners)</h2><p class="note" style="margin:0">Add anyone who pays you to promote them. They show at the top of the customer app with a Sponsored label.</p>${fld('Section title','D.shop.promoTitle',s.promoTitle)}${fld('Promote-here box text, example: Want to promote here? (leave empty to hide)','D.shop.promoCta',s.promoCta)}${D.promos.map((p,i)=>`<div class="item">${imgRow('promo',i,p.img,'banner image',`D.promos[${i}].img`)}<div class="r">${fld('Title',`D.promos[${i}].title`,p.title)}${fld('Button text',`D.promos[${i}].btn`,p.btn)}</div>${fld('Link (their page or website)',`D.promos[${i}].link`,p.link)}<label>Short text<textarea rows="2" oninput="D.promos[${i}].text=this.value">${E(p.text)}</textarea></label><label class="chk"><input type="checkbox" ${p.on!==false?'checked':''} onchange="D.promos[${i}].on=this.checked">Show in app</label><button class="d" onclick="D.promos.splice(${i},1);ra()">Delete promotion</button></div>`).join('')}<button onclick="D.promos.unshift({id:Date.now(),title:'',text:'',img:'',link:'',btn:'Visit',on:true});ra()">Add promotion</button></div>
<div class="c"><h2>About section</h2><p class="note" style="margin:0">Your information at the bottom of the customer app: about you, how to promote with you, prices, contact.</p>${fld('Title','D.shop.aboutTitle',s.aboutTitle)}<label>Text (links work)<textarea rows="6" oninput="D.shop.aboutText=this.value">${E(s.aboutText)}</textarea></label></div>
<div class="c"><h2>Support options</h2><p class="note" style="margin:0">Extra buttons in the customer Support menu (Telegram, Messenger, email and so on). Your Facebook page and WhatsApp are added automatically.</p>${D.shop.support.map((x,i)=>`<div class="item"><div class="r">${fld('Name',`D.shop.support[${i}].label`,x.label)}${fld('Link',`D.shop.support[${i}].url`,x.url)}</div><button class="d" onclick="D.shop.support.splice(${i},1);ra()">Remove</button></div>`).join('')}<button onclick="D.shop.support.push({label:'',url:''});ra()">Add support option</button></div>
<div class="c"><h2>Notifications</h2><p class="note" style="margin:0">Customers see a bell with a count. Popup ones open by themselves.</p>${D.notices.map((n,i)=>`<div class="item">${fld('Title',`D.notices[${i}].title`,n.title)}<label>Message<textarea rows="2" oninput="D.notices[${i}].body=this.value">${E(n.body)}</textarea></label><label class="chk"><input type="checkbox" ${n.popup?'checked':''} onchange="D.notices[${i}].popup=this.checked">Show as popup</label><button class="d" onclick="D.notices.splice(${i},1);ra()">Delete notification</button></div>`).join('')}<button onclick="D.notices.unshift({id:Date.now(),title:'',body:'',popup:true});ra()">Add notification</button></div>
<div class="c"><h2>Categories</h2>${D.categories.map((c,i)=>`<div class="item"><div class="r"><label>Name<input value="${E(c.name)}" oninput="renCat(${i},this.value)" onchange="ra()"></label><label>Color<input type="color" value="${c.color}" oninput="D.categories[${i}].color=this.value"></label></div>${fld('Icon (one emoji, example 💎)',`D.categories[${i}].icon`,c.icon)}${fld('WhatsApp number for this category (optional, digits only, with country code)',`D.categories[${i}].whatsapp`,c.whatsapp)}<button class="d" onclick="D.categories.splice(${i},1);ra()">Remove category</button></div>`).join('')}<button onclick="D.categories.push({name:'New category',color:'#ffb12e',icon:'🎮'});ra()">Add category</button></div>
<div class="c"><h2>Payment methods</h2>${D.payments.map((p,i)=>`<div class="item"><div class="r">${fld('Name',`D.payments[${i}].name`,p.name)}${fld('Details (number, account)',`D.payments[${i}].details`,p.details)}</div>${imgRow('pay',i,p.qr,'QR image',`D.payments[${i}].qr`)}<button class="d" onclick="D.payments.splice(${i},1);ra()">Remove payment method</button></div>`).join('')}<button onclick="D.payments.push({name:'',details:'',qr:''});ra()">Add payment method</button></div>
<div class="c"><h2>Products</h2>${D.products.map((p,i)=>`<div class="item">${imgRow('prod',i,p.img,'product image',`D.products[${i}].img`)}<div class="r">${fld('Title',`D.products[${i}].title`,p.title)}${fld('Price',`D.products[${i}].price`,p.price)}</div><div class="r">${fld('Old price (optional)',`D.products[${i}].old`,p.old)}${fld('Badge (HOT, NEW, SALE)',`D.products[${i}].badge`,p.badge)}</div><label>Category<select onchange="D.products[${i}].cat=this.value">${D.categories.map(c=>`<option ${c.name===p.cat?'selected':''}>${E(c.name)}</option>`).join('')}</select></label><label>Type<select onchange="D.products[${i}].free=this.value==='free';ra()"><option value="buy" ${p.free?'':'selected'}>Buy (paid)</option><option value="free" ${p.free?'selected':''}>Free</option></select></label>${p.free?`${fld('Download link (button shown to customers)',`D.products[${i}].dl`,p.dl)}<label>Free instructions (shown after they tap Get free; links work too)<textarea rows="3" oninput="D.products[${i}].freeNote=this.value">${E(p.freeNote)}</textarea></label>`:''}<label>Description<textarea rows="2" oninput="D.products[${i}].desc=this.value">${E(p.desc)}</textarea></label><label class="chk"><input type="checkbox" ${p.stock!==false?'checked':''} onchange="D.products[${i}].stock=this.checked">In stock</label><div class="imgrow"><button onclick="mv(${i},-1)">Move up</button><button onclick="mv(${i},1)">Move down</button><button class="d" onclick="if(confirm('Delete this product?')){D.products.splice(${i},1);ra()}">Delete product</button></div></div>`).join('')}<button onclick="D.products.unshift({id:'p'+Date.now(),cat:(D.categories[0]||{}).name||'',title:'New product',price:'',old:'',badge:'',desc:'',img:'',stock:true,free:false});ra()">Add product</button></div>`}
let CF={};try{CF=JSON.parse(localStorage.getItem('gh')||'{}')}catch(e){}
const api=p=>'https://api.github.com/repos/'+CF.repo+'/contents/'+p,H=()=>({Authorization:'Bearer '+CF.token,Accept:'application/vnd.github+json'});
const b64=t=>btoa(unescape(encodeURIComponent(t)));let sha=null;
async function put(path,content,message,s){const r=await fetch(api(path),{method:'PUT',headers:H(),body:JSON.stringify(Object.assign({message,content,branch:CF.branch||'main'},s?{sha:s}:{}))});if(!r.ok)throw new Error(r.status+' '+(await r.text()).slice(0,100));return r.json()}
const uploadImg=async f=>{const d=await resize(f),n='images/'+Date.now()+'.jpg';await put(n,d.split(',')[1],'Add image');TH[n]=d;return n};
async function load(){const r=await fetch(api('products.json')+'?ref='+(CF.branch||'main')+'&t='+Date.now(),{headers:H()});if(!r.ok)throw new Error('Could not open products.json ('+r.status+'). Check repository name, branch and token.');const j=await r.json();sha=j.sha;D=norm(JSON.parse(decodeURIComponent(escape(atob(j.content.replace(/\n/g,''))))));theme()}

function setup(err){$('bar').style.display='none';$('ed').innerHTML='<div class="c"><h2>Connect to GitHub</h2>'+(err?'<div class="tip">'+E(err)+'</div>':'')+'<label>Repository (username/repo)<input id="g1" value="'+E(CF.repo||'')+'"></label><label>Branch<input id="g2" value="'+E(CF.branch||'main')+'"></label><label>Access token<input id="g3" type="password" value="'+E(CF.token||'')+'"></label><button class="g" onclick="conn()">Connect</button></div>'}
